<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Minecraft Launcher</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="launcher" data-view="home" aria-label="Minecraft 启动器">
      <section class="main-view" aria-label="启动器主界面">
        <div class="profile">
          <span class="player-name">Steve</span>
          <div class="avatar-wrap">
            <img
              class="player-avatar"
              src="assets/player-avatar.png"
              alt="玩家头像占位"
              draggable="false"
            >
          </div>
        </div>

        <div class="launch-row">
          <button class="play-button" type="button" aria-label="开始游戏">
            <svg
              class="play-triangle"
              width="46"
              height="40"
              viewBox="0 0 46 40"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <polygon
                class="triangle-shape"
                points="23,3 43,35 3,35"
                stroke="#FFFFFF"
                stroke-width="3.5"
                stroke-linejoin="round"
              />
              <rect
                class="stop-icon"
                x="3"
                y="0"
                width="40"
                height="40"
                rx="12"
                fill="#FFFFFF"
              />
            </svg>
          </button>
          <button class="version-name" type="button">1.21.4</button>
        </div>

        <div class="corner-menu">
          <button
            class="corner-tile"
            type="button"
            aria-label="更多功能"
            aria-expanded="false"
          >
            <svg
              width="28"
              height="28"
              viewBox="0 0 32 32"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M7 16h18M16 7v18"
                stroke="#FFFFFF"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <div class="corner-panel" aria-label="功能面板">
            <button
              class="corner-item corner-settings-button"
              type="button"
              aria-label="设置"
            >
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="corner-item corner-download-button"
              type="button"
              aria-label="模组下载"
            >
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
                <path
                  d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="corner-item corner-placeholder"
              type="button"
              tabindex="-1"
              aria-hidden="true"
            ></button>
            <button
              class="corner-item corner-placeholder"
              type="button"
              tabindex="-1"
              aria-hidden="true"
            ></button>
            <button
              class="corner-item corner-placeholder"
              type="button"
              tabindex="-1"
              aria-hidden="true"
            ></button>
          </div>
        </div>
        <svg class="launch-ring" viewBox="0 0 72 72" aria-label="游戏启动进度">
          <circle class="launch-ring-track" cx="36" cy="36" r="24"></circle>
          <circle class="launch-ring-fill" cx="36" cy="36" r="24"></circle>
        </svg>
        <span class="launch-status" aria-live="polite"></span>
      </section>

      <section class="version-view" aria-label="版本界面">
        <aside class="folder-sidebar" aria-label="已导入文件夹">
          <div class="folder-list"></div>
        </aside>
        <aside class="version-sidebar" aria-label="已导入版本">
          <div class="version-list"></div>
        </aside>
        <div class="version-content">
          <button class="version-hero" type="button">1.21.4</button>
          <div class="rename-row">
            <button class="rename-button" type="button">重命名</button>
            <input
              class="rename-input"
              type="text"
              value="1.21.4"
              aria-label="版本名称"
              spellcheck="false"
            >
          </div>
          <div class="import-row">
            <button class="import-button" type="button">导入文件夹</button>
          </div>
        </div>
      </section>

      <section class="download-view" aria-label="模组下载界面">
        <aside class="download-category-sidebar" aria-label="下载分类">
          <button
            class="download-category-button is-active"
            type="button"
            data-download-category="vanilla"
          >原版</button>
          <button
            class="download-category-button"
            type="button"
            data-download-category="mods"
          >模组</button>
          <button
            class="download-category-button"
            type="button"
            data-download-category="shaders"
          >光影</button>
          <button
            class="download-category-button"
            type="button"
            data-download-category="resourcepacks"
          >材质包</button>
          <button
            class="download-category-button"
            type="button"
            data-download-category="datapacks"
          >数据包</button>
        </aside>

        <div class="download-content">
          <div class="download-toolbar">
            <button
              class="download-back-button"
              type="button"
              aria-label="返回"
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="m14.5 5-7 7 7 7"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="download-heading">
              <h2 class="download-title">原版</h2>
              <span class="download-mirror-badge">BMCLAPI 国内镜像</span>
            </div>
          </div>

          <div class="download-panel-stack">
            <div class="download-catalog-panel">
              <div class="download-loading">正在读取版本列表...</div>
              <div class="version-category-list"></div>
            </div>

            <div class="download-loader-panel" hidden>
              <div class="download-selected-version">
                <span>目标版本</span>
                <strong class="selected-download-version"></strong>
              </div>
              <div class="loader-option-list"></div>
            </div>

            <div class="download-placeholder-panel" hidden>
              <div class="download-placeholder-icon" aria-hidden="true"></div>
              <strong class="download-placeholder-title"></strong>
            </div>

            <div class="download-progress-panel" hidden>
              <div class="download-progress-track">
                <div class="download-progress-fill"></div>
              </div>
              <strong class="download-progress-percent">0%</strong>
              <p class="download-progress-message"></p>
            </div>
          </div>

          <button
            class="download-confirm-button"
            type="button"
            disabled
            hidden
          >确定</button>
        </div>
      </section>

      <section class="settings-view" aria-label="设置界面">
        <div class="settings-content">
          <button class="settings-hero" type="button">设置</button>
          <div class="settings-layout">
            <aside class="settings-sidebar" aria-label="设置分类">
              <button
                class="settings-nav-item is-active"
                type="button"
                data-settings-tab="general"
              >常规</button>
              <button
                class="settings-nav-item"
                type="button"
                data-settings-tab="personalization"
              >个性化</button>
            </aside>
            <div class="settings-main">
              <div class="settings-panel glass-surface settings-general-panel">
                <div class="settings-row">
                  <label class="settings-label" for="settings-java">
                    Java 路径
                  </label>
                  <div class="settings-field">
                    <input
                      id="settings-java"
                      class="settings-java-path"
                      type="text"
                      placeholder="自动检测"
                      spellcheck="false"
                    >
                    <button
                      class="settings-browse-button"
                      type="button"
                    >浏览</button>
                  </div>
                </div>

                <div class="settings-row">
                  <label class="settings-label" for="settings-memory">
                    启动内存
                  </label>
                  <div class="settings-field">
                    <input
                      id="settings-memory"
                      class="settings-memory"
                      type="number"
                      min="512"
                      max="16384"
                      step="512"
                      value="4096"
                    >
                    <span class="settings-unit">MB</span>
                  </div>
                </div>

                <div class="settings-row">
                  <label class="settings-label" for="settings-version">
                    默认版本
                  </label>
                  <div class="settings-field">
                    <input
                      id="settings-version"
                      class="settings-default-version"
                      type="text"
                      spellcheck="false"
                    >
                  </div>
                </div>

                <label class="settings-toggle-row">
                  <span>启动游戏后最小化启动器</span>
                  <input
                    class="settings-minimize"
                    type="checkbox"
                  >
                </label>

                <label class="settings-toggle-row">
                  <span>启动时自动选择上次文件夹</span>
                  <input
                    class="settings-auto-folder"
                    type="checkbox"
                  >
                </label>
              </div>

              <div
                class="settings-panel glass-surface settings-personalization-panel"
                hidden
              >
                <label class="settings-toggle-row">
                  <span>深色模式</span>
                  <input
                    class="settings-dark-mode"
                    type="checkbox"
                  >
                </label>

                <div class="settings-row">
                  <span class="settings-label">壁纸</span>
                  <div
                    class="settings-wallpaper-preview"
                    aria-hidden="true"
                  ></div>
                  <div class="settings-field">
                    <input
                      class="settings-wallpaper-path"
                      type="text"
                      placeholder="未设置壁纸"
                      readonly
                    >
                    <button
                      class="settings-wallpaper-button"
                      type="button"
                    >更换壁纸</button>
                  </div>
                </div>
              </div>

              <div class="settings-actions">
                <button
                  class="save-settings-button"
                  type="button"
                >保存设置</button>
                <span class="settings-status" aria-live="polite"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="account-menu" hidden>
        <button class="verify-premium-button" type="button">正版验证</button>
        <button
          class="logout-account-button"
          type="button"
          hidden
        >退出账号</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>

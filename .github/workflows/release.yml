name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Release check
        run: python release_check.py

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name MinecraftLauncher
          --add-data "index.html;."
          --add-data "styles.css;."
          --add-data "script.js;."
          --add-data "assets/player-avatar.png;assets"
          launcher.py

      - name: Package
        run: >
          Compress-Archive -Path dist/MinecraftLauncher/*
          -DestinationPath MinecraftLauncher-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MinecraftLauncher-windows-x64.zip
          generate_release_notes: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher-windows-x64
          path: MinecraftLauncher-windows-x64.zip
